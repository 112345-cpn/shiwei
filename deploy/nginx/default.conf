# ===============================================
# 容器内 nginx：静态前端 + 反向代理
# 与本地 E:\nginx-1.18.0\conf\nginx.conf 行为一致，
# 区别是 upstream 用 compose 服务名 app 而不是 127.0.0.1。
# ===============================================

server {
    listen       80;
    server_name  localhost;

    charset utf-8;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ---------- 前端静态页面 ----------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 图片：先找打包进镜像的静态图，找不到再找用户上传的 ----------
    # 打包的 imgs/types、imgs/blogs 这些是随前端一起发布的；
    # 用户上传的图落在共享卷 /var/www/hmdp/imgs 里。
    # 两处都用 /imgs/ 前缀，所以这里必须「先静态、后上传」两级回退。
    location /imgs/ {
        root /usr/share/nginx/html;
        try_files $uri @uploaded;
    }

    location @uploaded {
        root /var/www/hmdp;
    }

    # ---------- 业务接口 ----------
    location /api {
        default_type  application/json;
        keepalive_timeout   30s;
        keepalive_requests  1000;
        proxy_http_version 1.1;

        # 前端统一以 /api 开头，后端本身没有这个前缀，这里剥掉
        rewrite /api(/.*) $1 break;

        proxy_pass_request_headers on;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout;
        proxy_pass http://app:8081;
    }

    # ---------- WebSocket 实时通知 ----------
    # 少了 Upgrade / Connection 这两个头，握手会被当成普通 HTTP 请求，
    # 前端 ws 永远收到 400，秒杀结果推不回来。
    location /ws {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # 长连接不能沿用默认 60s 超时，否则一分钟断一次
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 接口文档（Knife4j）----------
    location ~ ^/(doc\.html|webjars|v3/api-docs|swagger-ui|favicon\.ico) {
        proxy_pass http://app:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
