# Redis 7 配置（生产环境优化版）
# 配合 docker-compose.yml 使用

# ========== 基础配置 ==========
bind 0.0.0.0
protected-mode no
port 6379
daemonize no
loglevel notice
timeout 300
tcp-keepalive 60

# ========== 持久化配置 ==========
# RDB 快照（默认开启）
save 900 1
save 300 10
save 60 10000

# AOF 追加文件（更安全，建议生产开启）
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ========== 内存管理 ==========
maxmemory 512mb
maxmemory-policy allkeys-lru

# ========== 慢查询日志 ==========
slowlog-log-slower-than 10000
slowlog-max-len 128

# ========== 客户端配置 ==========
maxclients 10000

# ========== 安全配置（可选，建议生产启用） ==========
# requirepass your_strong_password_here
