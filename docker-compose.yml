name: shiwei

services:
  mysql:
    image: mysql:8.0
    container_name: shiwei-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: shiwei-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shiwei-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - mq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: shiwei-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PWD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQ_HOST: rabbitmq
      MQ_PORT: 5672
      MQ_USER: guest
      MQ_PWD: guest
      UPLOAD_DIR: /app/imgs
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"
    volumes:
      - upload_data:/app/imgs

  # WebSocket 网关。只做连接管理和消息转发，不碰数据库。
  # Go 的 goroutine 几 KB，单机能扛的并发连接数比 JVM 线程模型高一个量级，
  # 所以把长连接这块从 Java 里拆出来单独扩缩容。
  gateway:
    build: ./gateway
    container_name: shiwei-gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      GATEWAY_PORT: 8082
      # 容器内走服务名 + 内部端口，不是宿主机映射的 8081/5673
      JAVA_BASE_URL: http://app:8081
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PUSH_QUEUE: shiwei.queue.ws.push
      TZ: Asia/Shanghai
    ports:
      - "8082:8082"

volumes:
  mysql_data:
  redis_data:
  mq_data:
  upload_data:
