<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>登录 · 拾味 SHIWEI</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="auth">
    <!-- 左：品牌区 -->
    <aside class="auth__side">
      <a class="brand" href="index.html" style="color:#fff">
        <span class="brand__mark" style="background:#fff;color:#14110e">拾</span>
        <span class="brand__name">拾味<em>·</em>SHIWEI</span>
      </a>

      <div>
        <p class="auth__quote">
          别再看<em>刷出来的好评</em>，<br />
          看谁真的去过。
        </p>
        <p class="auth__note">
          拾味不卖榜单位置。评分、人均、营业时间全部摊开，
          筛选逻辑写在页面上，你能自己复核。
        </p>
      </div>

      <div style="font-size:12.5px;color:rgba(255,255,255,.4)">
        © 2026 SHIWEI · 杭州
      </div>
    </aside>

    <!-- 右：表单 -->
    <main class="auth__main">
      <div class="auth__box">
        <h1 class="auth__title">登录 / 注册</h1>
        <p class="auth__sub">没有账号？输手机号就自动创建。</p>

        <form id="form" novalidate>
          <div class="field">
            <label class="field__label" for="phone">手机号</label>
            <input class="input" id="phone" type="tel" inputmode="numeric" maxlength="11"
                   placeholder="11 位手机号" autocomplete="tel" />
          </div>

          <div class="field">
            <label class="field__label" for="code">验证码</label>
            <div class="input-group">
              <input class="input" id="code" type="text" inputmode="numeric" maxlength="6"
                     placeholder="6 位数字" autocomplete="one-time-code" />
              <button class="btn btn--ghost" type="button" id="send" style="flex:none;min-width:112px">
                获取验证码
              </button>
            </div>
          </div>

          <button class="btn btn--primary btn--lg btn--block" type="submit" id="submit"
                  style="margin-top:24px">
            进入拾味
          </button>
        </form>

        <p class="auth__hint" id="hint">
          本地开发环境会把验证码直接带回来并自动填入；
          生产环境走真实短信通道，不会回传。
        </p>
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (() => {
      const $phone = document.getElementById('phone');
      const $code = document.getElementById('code');
      const $send = document.getElementById('send');
      const $submit = document.getElementById('submit');
      const $hint = document.getElementById('hint');

      let countdown = 0;
      let timer = null;

      function validPhone(p) {
        return /^1[3-9]\d{9}$/.test(p);
      }

      /* ---------- 发送验证码 ---------- */

      $send.onclick = async () => {
        const phone = $phone.value.trim();
        if (!validPhone(phone)) {
          UI.toast('手机号格式不对', 'err');
          $phone.focus();
          return;
        }

        $send.disabled = true;
        $send.textContent = '发送中…';

        try {
          const res = await API.User.sendCode(phone);

          // 后端在开发环境会把验证码带回来，方便本地自测
          if (res.data && res.data.code) {
            $code.value = res.data.code;
            $hint.innerHTML =
              '开发环境已自动填入验证码 <code>' + UI.esc(res.data.code) + '</code>' +
              '（生产环境不会返回）';
          } else {
            UI.toast('验证码已发送', 'ok');
          }

          countdown = 60;
          tick();
        } catch (e) {
          UI.toast(e.message, 'err');
          $send.disabled = false;
          $send.textContent = '获取验证码';
        }
      };

      function tick() {
        clearInterval(timer);
        if (countdown <= 0) {
          $send.disabled = false;
          $send.textContent = '重新获取';
          return;
        }
        $send.textContent = countdown + 's';
        timer = setInterval(() => {
          countdown -= 1;
          if (countdown <= 0) {
            clearInterval(timer);
            $send.disabled = false;
            $send.textContent = '重新获取';
          } else {
            $send.textContent = countdown + 's';
          }
        }, 1000);
      }

      /* ---------- 登录 ---------- */

      document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();

        const phone = $phone.value.trim();
        const code = $code.value.trim();

        if (!validPhone(phone)) return UI.toast('手机号格式不对', 'err');
        if (code.length !== 6) return UI.toast('验证码是 6 位', 'err');

        $submit.disabled = true;
        $submit.textContent = '登录中…';

        try {
          const res = await API.User.login(phone, code);
          const data = res.data || {};

          // 后端直接返回 token 字符串，也可能返回 {token}
          const token = typeof data === 'string' ? data : data.token;
          API.setSession(token, data.user || null);

          // 拉一次 /me 确保用户信息进本地
          try {
            const me = await API.User.me();
            if (me.data) API.setUser(me.data);
          } catch (err) {
            /* 失败也不影响跳转 */
          }

          UI.toast('欢迎回来', 'ok');
          const back = UI.param('back');
          setTimeout(() => {
            location.href = back || 'index.html';
          }, 320);
        } catch (err) {
          UI.toast(err.message, 'err');
          $submit.disabled = false;
          $submit.textContent = '进入拾味';
        }
      };

      /* 已登录直接走 */
      if (API.isLogin()) {
        const back = UI.param('back');
        location.replace(back || 'index.html');
      }
    })();
  </script>
</body>
</html>
