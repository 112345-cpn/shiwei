<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>笔记 · 拾味 SHIWEI</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .article {
      max-width: 720px;
      margin: 0 auto;
    }
    .article__title {
      font-size: clamp(24px, 3.4vw, 34px);
      line-height: 1.24;
      letter-spacing: -0.8px;
      font-weight: 800;
      margin: 22px 0 14px;
    }
    .article__by {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }
    .article__by b {
      font-size: 14px;
    }
    .article__by .muted {
      font-size: 12.5px;
    }
    .article__cover {
      border-radius: var(--r-lg);
      overflow: hidden;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ece7e0, #ded6cc);
    }
    .article__cover img {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
    }
    .article__text {
      font-size: 16px;
      line-height: 1.9;
      color: var(--ink-2);
      white-space: pre-wrap;
      margin: 24px 0;
    }
    .article__gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 8px 0 24px;
    }
    .article__gallery img {
      width: 100%;
      border-radius: var(--r-md);
      object-fit: cover;
      aspect-ratio: 4 / 3;
    }
    .likebar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .likebtn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 40px;
      padding: 0 18px;
      border-radius: var(--r-full);
      border: 1px solid var(--line-strong);
      background: var(--surface);
      font-size: 14px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      transition: all 0.16s;
    }
    .likebtn:hover {
      border-color: var(--brand);
      color: var(--brand);
    }
    .likebtn.is-on {
      background: var(--brand-soft);
      border-color: var(--brand-soft-2);
      color: var(--brand);
    }
    .likers {
      display: flex;
      align-items: center;
      gap: -8px;
    }
    .likers img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--surface);
      margin-left: -8px;
      object-fit: cover;
      background: var(--brand-soft);
    }
    .likers img:first-child {
      margin-left: 0;
    }
  </style>
</head>
<body>
  <div id="app-header"></div>

  <main class="page">
    <div class="wrap">
      <div class="article" id="article">
        <div class="sk sk-line" style="width:30%;height:16px;margin-bottom:20px"></div>
        <div class="sk" style="width:100%;aspect-ratio:4/3;border-radius:20px"></div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (() => {
      const id = Number(UI.param('id'));
      const $box = document.getElementById('article');
      let blog = null;

      function render() {
        document.title = (blog.title || '笔记') + ' · 拾味 SHIWEI';

        const imgs = UI.imageList(blog.images);
        const cover = imgs[0];
        const rest = imgs.slice(1);
        const liked = blog.isLike === true;

        $box.innerHTML =
          '<div class="article__by" style="border:0;padding:0;margin-bottom:18px">' +
            '<a href="index.html" class="muted" style="font-size:13.5px">← 返回</a>' +
          '</div>' +
          '<h1 class="article__title">' + UI.esc(blog.title || '无标题') + '</h1>' +
          '<div class="article__by">' +
            '<img class="avatar" src="' + UI.esc(blog.icon || UI.DEFAULT_AVATAR) + '" alt="" ' +
            'onerror="this.src=\'' + UI.DEFAULT_AVATAR + '\'" />' +
            '<div style="flex:1;min-width:0">' +
              '<b>' + UI.esc(blog.name || '匿名') + '</b>' +
              '<div class="muted">' + UI.timeAgo(blog.createTime) + '</div>' +
            '</div>' +
            '<button class="btn btn--ghost btn--sm" id="follow">关注</button>' +
          '</div>' +
          (cover
            ? '<div class="article__cover" style="margin-top:20px"><img src="' + UI.esc(cover) +
              '" alt="" referrerpolicy="no-referrer" onerror="this.remove()" /></div>'
            : '') +
          '<div class="article__text">' + UI.esc(blog.content || '') + '</div>' +
          (rest.length
            ? '<div class="article__gallery">' +
              rest.map((u) => '<img src="' + UI.esc(u) + '" alt="" loading="lazy" ' +
                'referrerpolicy="no-referrer" onerror="this.remove()" />').join('') +
              '</div>'
            : '') +
          '<div class="likebar">' +
            '<button class="likebtn ' + (liked ? 'is-on' : '') + '" id="like">' +
              (liked ? UI.icons.heartFill : UI.icons.heart) +
              '<span>' + UI.sold(blog.liked) + '</span>' +
            '</button>' +
            '<div class="likers" id="likers"></div>' +
          '</div>';

        // 点赞
        const $like = document.getElementById('like');
        $like.onclick = async () => {
          if (!UI.requireLogin()) return;
          const on = $like.classList.contains('is-on');
          const n = Number($like.querySelector('span').textContent) || 0;
          $like.classList.toggle('is-on', !on);
          $like.querySelector('svg').outerHTML = on ? UI.icons.heart : UI.icons.heartFill;
          $like.querySelector('span').textContent = String(on ? Math.max(n - 1, 0) : n + 1);
          try {
            await API.Blog.like(blog.id);
          } catch (e) {
            UI.toast(e.message, 'err');
            $like.classList.toggle('is-on', on);
            $like.querySelector('svg').outerHTML = on ? UI.icons.heartFill : UI.icons.heart;
            $like.querySelector('span').textContent = String(n);
          }
        };

        // 关注
        const $follow = document.getElementById('follow');
        if (!blog.userId) {
          $follow.style.display = 'none';
        } else {
          API.Follow.isFollow(blog.userId)
            .then((res) => setFollow(res.data === true))
            .catch(() => {});

          $follow.onclick = async () => {
            if (!UI.requireLogin()) return;
            const on = $follow.dataset.on === '1';
            try {
              await API.Follow.follow(blog.userId, !on);
              setFollow(!on);
            } catch (e) {
              UI.toast(e.message, 'err');
            }
          };
        }

        function setFollow(on) {
          $follow.dataset.on = on ? '1' : '0';
          $follow.textContent = on ? '已关注' : '关注';
          $follow.className = on ? 'btn btn--ghost btn--sm' : 'btn btn--dark btn--sm';
        }

        // 点赞的人（后端只返回前 5 个）
        API.Blog.likes(blog.id)
          .then((res) => {
            const users = res.data || [];
            if (!users.length) return;
            document.getElementById('likers').innerHTML = users
              .map((u) =>
                '<img src="' + UI.esc(u.icon || UI.DEFAULT_AVATAR) + '" alt="' + UI.esc(u.nickName || '') +
                '" title="' + UI.esc(u.nickName || '') + '" onerror="this.src=\'' + UI.DEFAULT_AVATAR + '\'" />'
              )
              .join('');
          })
          .catch(() => {});
      }

      UI.mountHeader('notes');
      UI.mountFooter();

      (async () => {
        if (!id) {
          $box.innerHTML = UI.empty('笔记不存在', '链接里少了 id');
          return;
        }
        try {
          const res = await API.Blog.detail(id);
          blog = res.data;
          if (!blog) {
            $box.innerHTML = UI.empty('笔记不存在', '可能被删了');
            return;
          }
          render();
        } catch (e) {
          $box.innerHTML = UI.empty('没加载出来', e.message);
        }
      })();
    })();
  </script>
</body>
</html>
